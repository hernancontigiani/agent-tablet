[project]
# PyPI distribution name ("agent-session-manager" is taken by an unrelated CLI
# tool). The installed command is "agent-session-manager"; the import package
# stays "claude_session_manager".
name = "agent-session-manager-gtk"
version = "1.1.1"
description = "Native GTK4 terminal workspace for AI coding agents (Claude Code, Cursor)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Máté Molnár", email = "molnar.mate@zengo.eu" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
# PyGObject/GTK/VTE come from system packages (see README), not pip:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91
dependencies = []

[project.urls]
Homepage = "https://github.com/r4nd3l/agent-session-manager"
Issues = "https://github.com/r4nd3l/agent-session-manager/issues"

[project.scripts]
agent-session-manager = "claude_session_manager.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_session_manager*"]

[tool.setuptools.package-data]
claude_session_manager = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]  # gi.require_version must precede gi.repository imports

[tool.pytest.ini_options]
testpaths = ["tests"]

# Development tools, run through `uv run`. PyGObject, GTK, libadwaita and VTE are not here: they
# come from the system packages, which is why the venv is created with --system-site-packages.
[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "pyright==1.1.414",
    "pygobject-stubs==2.20.0",
]

[tool.uv]
# pygobject-stubs declares PyGObject as a dependency, and installing it from PyPI builds pycairo
# from source. The system's PyGObject is the one that must load, so it is dropped from resolution:
# this marker never matches.
override-dependencies = ["pygobject; sys_platform == 'never'"]
