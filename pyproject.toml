[project]
name = "agent-tablet"
version = "1.1.1"
description = "Native GTK4 terminal workspace for AI coding agents (Claude Code, Cursor)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Hernan Contigiani" },
    { name = "Máté Molnár", email = "molnar.mate@zengo.eu" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
# PyGObject/GTK/VTE come from system packages (see README), not pip:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91
dependencies = []

[project.urls]
Homepage = "https://github.com/hernancontigiani/agent-tablet"
Issues = "https://github.com/hernancontigiani/agent-tablet/issues"

[project.scripts]
agent-tablet = "agent_tablet.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_tablet*"]

[tool.setuptools.package-data]
agent_tablet = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "T20"]
ignore = [
    # gi.require_version must precede the gi.repository imports it pins.
    "E402",
    # The "…", "·" and "–" in user-visible strings are deliberate typography, and the
    # translations keep them.
    "RUF001",
    "RUF002",
    "RUF003",
    # StrEnum is not a drop-in for (str, Enum): it changes what str(member) returns, and a
    # serialized enum must not change.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Command-line tools: stdout is their interface, not a leftover trace.
"scripts/*" = ["T201"]
# A translation table keeps each source string and its translation on one line, so a msgid can be
# found and diffed as a whole.
"po/generate.py" = ["T201", "E501"]
"tools/ui/check.py" = ["T201"]
"tools/ui/serve.py" = ["T201"]
"tools/ui/session.py" = ["T201"]
"docs/history/nothing_lost.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Development tools, run through `uv run`. PyGObject, GTK, libadwaita and VTE are not here: they
# come from the system packages, which is why the venv is created with --system-site-packages.
[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "pyright==1.1.414",
    "pygobject-stubs==2.20.0",
    "playwright==1.64.1",
    "watchfiles==1.3.0",
    "time-machine==3.6.0",
    "pytest-cov==7.1.0",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["agent_tablet", "tests", "tools", "scripts", "po", "docs/history"]
# The runtime of the gi stubs is the system's PyGObject, which the venv imports through
# --system-site-packages and pyright does not follow; the warning says only that.
reportMissingModuleSource = false

[tool.uv]
# pygobject-stubs declares PyGObject as a dependency, and installing it from PyPI builds pycairo
# from source. The system's PyGObject is the one that must load, so it is dropped from resolution:
# this marker never matches.
override-dependencies = ["pygobject; sys_platform == 'never'"]
